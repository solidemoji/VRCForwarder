plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.example.uvcforwarder'
    compileSdk {
        version = release(36) {
            minorApiLevel = 1
        }
    }

    // ★ 原生层（应用侧绕过）：libusb 做 ISO 传输 —— Android 的 UsbRequest 不支持等时端点。
    //   本机 NDK 25.1；cmake 用 SDK 里已装的 4.1.2。
    ndkVersion "25.1.8937393"

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "4.1.2"
        }
    }

    defaultConfig {
        applicationId "com.example.uvcforwarder"
        minSdk 28
        // ★ targetSdk 刻意压到 27（不是 28）：
        // ① 侧载工具 App，低 targetSdk 可避开 Android 10+ 前台服务类型限制，
        //    使 RECORD_AUDIO 保活 + 后台转发行为与老系统一致；不上架商店，无合规压力。
        // ② 【关键·Android 10 兼容】Android 10 (SDK 29) 对 UVC(class 14) USB 设备有权限判据：
        //    targetSdk >= 28 时，**即使已授予 CAMERA 权限**也拿不到该 UVC 设备的 USB 权限。
        //    证据：saki4510t/UVCPermissionTest 实测（Pixel3 / Essential PH-1）
        //          targetSdk <= 27 → OK；targetSdk >= 28 → NG(unexpected)
        //    源码：AOSP UsbUserPermissionManager 按 targetSdkVersion >= VERSION_CODES.P 判定，
        //          拒绝时"不弹窗、直接拒"，logcat: "Camera permission required for USB video
        //          class devices"。CameraFi 官方公告亦确认，Android 11 已修复。
        //    ⇒ 压到 27 是 Android 10（Pico 4 / 4 Pro）能打开外接 UVC 相机的前提。
        targetSdk 27
        // 0.x 版本号：功能可日常使用，但仍在迭代
        // 0.0.2: 修复 Quest (Horizon OS) 上 2D 面板无法创建导致启动被静默拒绝的问题
        // 0.0.3: ★ Quest 上外接 UVC 摄像头的关键修复 —— 补 horizonos.permission.USB_CAMERA
        //        （该权限是 Quest 打开 UVC 设备的唯一门禁，缺失时 openDevice 必抛 SecurityException）
        //        并移除 device_filter 声明（避免系统不弹权限框）；Pico/手机不受影响
        // 0.0.4: 文档/文案更新 —— 五语言「使用方法」补 Quest 系统弹窗提示
        //        （插 USB 设备时若弹出「用哪个应用打开」/虚拟屏选择，可点「不允许」，
        //         反复弹出直接关闭即可，不影响本 App）；README/Release 说明同步
        // 0.0.5: ① 新增「规格」手动选择（按相机描述符真实能力表列出 格式×分辨率×帧率），
        //          并显示当前实际生效的规格（自动模式亦标注自动选中了哪一档）
        //        ② 规格列表过滤 <30fps 档位（实测无实用价值）
        //        ③ targetSdk 28 → 27：针对 Android 10「有 CAMERA 权限仍拿不到 UVC USB 权限」
        //          的已知行为（未上机验证，无 Android 10 设备）
        //        ④ 修正教程「必须同一 5GHz Wi-Fi」→ 同一局域网即可
        //      0.0.6 (code 8)：
        //        ① 非 Quest 平台不再请求不存在的 horizonos.permission.USB_CAMERA ——
        //           原写法用 checkSelfPermission 的 try/catch 兜底，但对**不存在**的权限名
        //           它并不抛异常、只返回 DENIED ⇒ Pico/手机上永远被判"待授权"，
        //           每次启动白跑一轮 requestPermissions。改用 getPermissionInfo 探测存在性。
        //        ② 「系统未暴露接口」的相机不再静默消失：接口数为 0 时用 GET_DESCRIPTOR
        //           自读原始描述符确认它是不是相机，是就列出来并标注原因（Pico 4/Android 10
        //           实测：部分相机描述符会让系统解析器抛 IllegalArgumentException → 0 接口）
        //      0.0.7 (code 9)：★★「应用侧绕过」功能落地 —— Android 10 丢接口不再等于不可用
        //        ① 系统视图里找不到可用视频流端点时，自己读配置描述符解析出 VS 接口号/端点，
        //           用反射构造 UsbInterface/UsbEndpoint 后 claim，走完标准 probe/commit 握手。
        //           ★ 实测 Pico 4 / Android 10 + 自家 XIAO 固件（系统只暴露 3 接口、缺 VS）：
        //             claim 接口3 成功 → probe/commit=26 → bulkTransfer 持续读到帧数据，
        //             PC 端接收器实测 8 秒收到 1.45MB 真实 MJPEG（≈180KB/s）。
        //        ② ★ 关键教训：回退必须**排在 findAnyBulkIn 之前** —— 系统丢了 VS 接口时
        //           「任意接口找 bulk-IN」会在 CDC 数据接口上找到端点（陷阱），
        //           probe 发到错误接口号 → s1/s2/GET 全 -1。
        //        ③ ★ ISO 相机（免驱模组）同样能救：系统枚举失败（接口数 0）的设备不再判为
        //           不可用，按原始描述符解析出的端点类型归类 —— BULK 走原始描述符回退，
        //           ISO 交给 saki/libuvc 原生栈（= 已在跑 120fps 的那条通路，不需要自写 libusb）。
        //           ★ 且这类设备不信任能力表协商：实测 GC0308 协商出 MJPEG 320x240@120 设不上、
        //             拿不到帧；改成直接设 MJPEG 640x480@30 后正常出流，PC 端收到画面。
        //      0.0.10 (code 12)：★★ 修真凶 —— 关掉 tryBypass 里的 libusb ISO 探针
        //        根因（实证）：对 0 接口设备（GC0308）尝试绕过时会调 streamIsoLibusb()，
        //        它对设备做 claim/setAlt/probe/commit/ISO 读，**与随后 IsoUvcSession
        //        启动的 saki 原生栈抢同一颗相机** ⇒ saki 的 setPreviewSize 被拒、
        //        收不到画面，并在 uvc-slots 线程 Fatal signal 6 (SIGABRT) 崩溃。
        //        ⇒ 现在这里只做「读原始描述符 + 记端点类型」，ISO 取流一律交给 saki。
        //      0.0.9 (code 11)：修「点列表里的转发不弹权限框 / 授权后还要再点一次」
        //        ① 根因：requestSingleAuth() 建 PendingIntent 时**漏了 setPackage()** ——
        //           Android 12+ 拦截隐式 Intent，隐式 PendingIntent 会让系统权限对话框
        //           **根本不弹**且回调永不触发（总开关那条路径本来就有这行，单设备漏了）。
        //           ⇒ 表现就是"点列表里的转发没反应"，GC0308（0 接口设备）尤其明显。
        //        ② 单设备路径补上与总开关一致的 2.5 秒超时兜底：部分设备系统根本不弹窗，
        //           超时后仍尝试继续，并给出明确状态提示（新增 msg_perm_wait，5 语言）。
        versionCode 12
        versionName "0.0.10"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // ★ 原生层：只出 arm64（Pico / Quest / 手机均为 arm64）；libusb 源码路径见 cpp/CMakeLists.txt
        ndk {
            abiFilters "arm64-v8a"
        }
        externalNativeBuild {
            cmake {
                arguments "-DLIBUSB_DIR=E:/libusb"
            }
        }
    }

    // 侧载自签名（本机自用，非商店发布）：长期有效 30 年
    signingConfigs {
        sideLoad {
            storeFile file('../uvcforwarder.jks')
            storePassword 'uvcforwarder'
            keyAlias 'uvcforwarder'
            keyPassword 'uvcforwarder'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.sideLoad
        }
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.sideLoad
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // 侧载包不做 lint 阻断（checkReleaseBuilds 关掉可加快构建）
    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    // 生成 BuildConfig（AGP 8+ 默认关闭）——App 内显示版本号用
    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

// 侧载签名与 testOnly 处理：
// debug 变体的 testOnly 标记通过 AndroidManifest.xml 中的
// android:testOnly="false" 显式关闭（见 src/main/AndroidManifest.xml），
// 使 debug/release 包都能直接侧载，无需 adb install -t。

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    // 标准免驱 UVC 摄像头(ISO 等时传输)支持：AndroidUSBCamera 2.3.4
    // aar 内含 saki UVCCamera Java 层 + arm64/armv7/x86 .so；其传递依赖
    // com.serenegiant:common:4.1.1 由 saki libcommon raw 仓库提供（勿 exclude！）
    implementation 'com.github.jiangdongguo:AndroidUSBCamera:2.3.4'
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}
