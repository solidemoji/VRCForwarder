plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.example.uvcforwarder'
    compileSdk {
        version = release(36) {
            minorApiLevel = 1
        }
    }

    defaultConfig {
        applicationId "com.example.uvcforwarder"
        minSdk 28
        // ★ targetSdk 刻意压到 27（不是 28）：
        // ① 侧载工具 App，低 targetSdk 可避开 Android 10+ 前台服务类型限制，
        //    使 RECORD_AUDIO 保活 + 后台转发行为与老系统一致；不上架商店，无合规压力。
        // ② 【关键·Android 10 兼容】Android 10 (SDK 29) 对 UVC(class 14) USB 设备有权限判据：
        //    targetSdk >= 28 时，**即使已授予 CAMERA 权限**也拿不到该 UVC 设备的 USB 权限。
        //    证据：saki4510t/UVCPermissionTest 实测（Pixel3 / Essential PH-1）
        //          targetSdk <= 27 → OK；targetSdk >= 28 → NG(unexpected)
        //    源码：AOSP UsbUserPermissionManager 按 targetSdkVersion >= VERSION_CODES.P 判定，
        //          拒绝时"不弹窗、直接拒"，logcat: "Camera permission required for USB video
        //          class devices"。CameraFi 官方公告亦确认，Android 11 已修复。
        //    ⇒ 压到 27 是 Android 10（Pico 4 / 4 Pro）能打开外接 UVC 相机的前提。
        targetSdk 27
        // 0.x 版本号：功能可日常使用，但仍在迭代
        // 0.0.2: 修复 Quest (Horizon OS) 上 2D 面板无法创建导致启动被静默拒绝的问题
        // 0.0.3: ★ Quest 上外接 UVC 摄像头的关键修复 —— 补 horizonos.permission.USB_CAMERA
        //        （该权限是 Quest 打开 UVC 设备的唯一门禁，缺失时 openDevice 必抛 SecurityException）
        //        并移除 device_filter 声明（避免系统不弹权限框）；Pico/手机不受影响
        // 0.0.4: 文档/文案更新 —— 五语言「使用方法」补 Quest 系统弹窗提示
        //        （插 USB 设备时若弹出「用哪个应用打开」/虚拟屏选择，可点「不允许」，
        //         反复弹出直接关闭即可，不影响本 App）；README/Release 说明同步
        versionCode 6
        versionName "0.0.4"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    // 侧载自签名（本机自用，非商店发布）：长期有效 30 年
    signingConfigs {
        sideLoad {
            storeFile file('../uvcforwarder.jks')
            storePassword 'uvcforwarder'
            keyAlias 'uvcforwarder'
            keyPassword 'uvcforwarder'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.sideLoad
        }
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.sideLoad
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // 侧载包不做 lint 阻断（checkReleaseBuilds 关掉可加快构建）
    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    // 生成 BuildConfig（AGP 8+ 默认关闭）——App 内显示版本号用
    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

// 侧载签名与 testOnly 处理：
// debug 变体的 testOnly 标记通过 AndroidManifest.xml 中的
// android:testOnly="false" 显式关闭（见 src/main/AndroidManifest.xml），
// 使 debug/release 包都能直接侧载，无需 adb install -t。

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    // 标准免驱 UVC 摄像头(ISO 等时传输)支持：AndroidUSBCamera 2.3.4
    // aar 内含 saki UVCCamera Java 层 + arm64/armv7/x86 .so；其传递依赖
    // com.serenegiant:common:4.1.1 由 saki libcommon raw 仓库提供（勿 exclude！）
    implementation 'com.github.jiangdongguo:AndroidUSBCamera:2.3.4'
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}
